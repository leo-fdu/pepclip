[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pepclip"
version = "0.1.0"
description = "Frozen protein and molecular encoders aligned with CLIP"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
chem = ["rdkit>=2023.9"]
esm = ["fair-esm>=2.0"]

[project.scripts]
pepclip = "pepclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
